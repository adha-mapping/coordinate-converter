<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2D to 3D Coordinate Converter</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 300px; }
  </style>
</head>
<body>
  <div class="container py-4">
    <h2 class="mb-4 text-center">2D to 3D Coordinate Converter</h2>
    <form id="converterForm">
      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Coordinate System (2D)</label>
          <select id="coordSystem" class="form-select">
            <option value="RSO">RSO</option>
            <option value="UTM">UTM</option>
            <option value="Cassini">Cassini-Soldner</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Easting (X)</label>
          <input type="number" id="easting" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Northing (Y)</label>
          <input type="number" id="northing" class="form-control" required>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-4">
          <label class="form-label">Height (Z)</label>
          <input type="number" id="height" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Output System (3D)</label>
          <select id="outputSystem" class="form-select">
            <option value="WGS84">WGS84</option>
            <option value="GDM2000">GDM2000</option>
          </select>
        </div>
        <div class="col-md-4 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Convert</button>
        </div>
      </div>
    </form>

    <div class="mb-3">
      <h5>Result (Latitude, Longitude, Ellipsoidal Height)</h5>
      <p id="result">-</p>
      <button class="btn btn-success" id="exportCSV">Export to CSV</button>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const form = document.getElementById('converterForm');
    const result = document.getElementById('result');
    const exportBtn = document.getElementById('exportCSV');
    let convertedData = null;

    const map = L.map('map').setView([1.5, 103.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
    }).addTo(map);
    let marker = null;

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const x = parseFloat(document.getElementById('easting').value);
      const y = parseFloat(document.getElementById('northing').value);
      const z = parseFloat(document.getElementById('height').value);

      // Placeholder for real conversion logic
      const lat = y / 100000 + 1;
      const lon = x / 100000 + 100;
      const h = z;
      result.innerText = `Latitude: ${lat.toFixed(6)}, Longitude: ${lon.toFixed(6)}, Height: ${h}m`;

      if (marker) map.removeLayer(marker);
      marker = L.marker([lat, lon]).addTo(map);
      map.setView([lat, lon], 12);

      convertedData = { lat, lon, h };
    });

    exportBtn.addEventListener('click', function() {
      if (!convertedData) return alert('No data to export');
      const csv = `Latitude,Longitude,Height\n${convertedData.lat},${convertedData.lon},${convertedData.h}`;
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'converted_coordinates.csv';
      link.click();
    });
  </script>
</body>
</html>
